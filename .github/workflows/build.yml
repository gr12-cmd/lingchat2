name: 构建前端

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # ← 改成 24
          
      - name: 安装依赖
        run: npm install --legacy-peer-deps
        
      - name: 构建
        run: npm run build
        
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
